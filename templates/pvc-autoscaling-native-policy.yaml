{{- if eq (include "datafy-agent.extendedInstallEnabled" .) "true" }}
# Rules for the "datafy.io/autoscaling-native" annotation on PVCs:
#   CREATE: annotation may be absent, or present with value "true" or "false".
#   UPDATE: - cannot be added if it wasn't set at creation, since it is only read when
#             the volume is created and adding it later would be misleading.
#           - may be changed or removed freely; we drop it ourselves after creation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: datafy-pvc-autoscaling-native
  labels:
  {{- include "datafy-agent.labels" . | nindent 4 }}
  {{- with .Values.extraAnnotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE", "UPDATE" ]
        resources: [ "persistentvolumeclaims" ]
  variables:
    - name: isUpdate
      expression: "request.operation == 'UPDATE'"
    # oldObject is null on CREATE; the ternary short-circuits so it is never touched there.
    - name: oldAnn
      expression: "variables.isUpdate ? oldObject.metadata.?annotations.orValue({}) : {}"
    - name: newAnn
      expression: "object.metadata.?annotations.orValue({})"
    - name: hadIt
      expression: "'datafy.io/autoscaling-native' in variables.oldAnn"
    - name: hasIt
      expression: "'datafy.io/autoscaling-native' in variables.newAnn"
  validations:
    # 1. On CREATE the value must be "true" or "false" (absent is fine).
    - expression: >-
        variables.isUpdate ||
        variables.newAnn[?'datafy.io/autoscaling-native'].orValue('true') in ['true', 'false']
      message: "datafy.io/autoscaling-native must be \"true\" or \"false\""
      reason: Invalid
    # 2. Cannot be added after creation. Changing or removing it is allowed.
    - expression: "!variables.isUpdate || variables.hadIt || !variables.hasIt"
      message: "datafy.io/autoscaling-native must be set when the PVC is created; it cannot be added afterwards"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: datafy-pvc-autoscaling-native
  labels:
  {{- include "datafy-agent.labels" . | nindent 4 }}
  {{- with .Values.extraAnnotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyName: datafy-pvc-autoscaling-native
  validationActions: [ "Deny" ]
{{- end }}
