{{- if eq (include "datafy-agent.extendedInstallEnabled" .) "true" }}
# Rules for the "datafy.io/autoscaling-native" annotation on PVCs:
#   CREATE: annotation may be absent, or present with value "true" or "false".
#   UPDATE: - cannot be added if it wasn't set at creation
#           - cannot change value (true <-> false)
#           - CAN be removed, but only if the PVC is not datafied (datafy.io/state=managed), to allow off-boarding.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: datafy-pvc-autoscaling-native
  labels:
  {{- include "datafy-agent.labels" . | nindent 4 }}
  {{- with .Values.extraAnnotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE", "UPDATE" ]
        resources: [ "persistentvolumeclaims" ]
  variables:
    - name: isUpdate
      expression: "request.operation == 'UPDATE'"
    # oldObject is null on CREATE; the ternary short-circuits so it is never touched there.
    - name: oldAnn
      expression: "variables.isUpdate ? oldObject.metadata.?annotations.orValue({}) : {}"
    - name: newAnn
      expression: "object.metadata.?annotations.orValue({})"
    - name: hadIt
      expression: "'datafy.io/autoscaling-native' in variables.oldAnn"
    - name: hasIt
      expression: "'datafy.io/autoscaling-native' in variables.newAnn"
  validations:
    # 1. On CREATE the value must be "true" or "false" (absent is fine).
    - expression: >-
        variables.isUpdate ||
        variables.newAnn[?'datafy.io/autoscaling-native'].orValue('true') in ['true', 'false']
      message: "datafy.io/autoscaling-native must be \"true\" or \"false\""
      reason: Invalid
    # 2. Cannot be added after creation.
    - expression: "!variables.isUpdate || variables.hadIt || !variables.hasIt"
      message: "datafy.io/autoscaling-native cannot be added after the PVC is created"
      reason: Forbidden
    # 3. Cannot change value once set.
    - expression: >-
        !variables.isUpdate || !variables.hadIt || !variables.hasIt ||
        variables.newAnn['datafy.io/autoscaling-native'] == variables.oldAnn['datafy.io/autoscaling-native']
      message: "datafy.io/autoscaling-native cannot be changed once set (it may only be removed)"
      reason: Forbidden
    # 4. Removal is allowed only when the PVC is not datafied
    #    (checked on both the old and the new object, so dropping
    #    datafy.io/state in the same request doesn't bypass the rule).
    - expression: >-
        !variables.isUpdate || !variables.hadIt || variables.hasIt ||
        (variables.oldAnn[?'datafy.io/state'].orValue('') != 'managed' &&
         variables.newAnn[?'datafy.io/state'].orValue('') != 'managed')
      message: "datafy.io/autoscaling-native cannot be removed while datafy.io/state=managed"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: datafy-pvc-autoscaling-native
  labels:
  {{- include "datafy-agent.labels" . | nindent 4 }}
  {{- with .Values.extraAnnotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyName: datafy-pvc-autoscaling-native
  validationActions: [ "Deny" ]
{{- end }}
