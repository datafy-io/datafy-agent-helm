{{- if eq (include "datafy-agent.extendedInstallEnabled" .) "true" }}
{{- $name := "datafy-controller-webhook" }}
{{- $fqdn := printf "%s.%s.svc" $name .Release.Namespace }}
{{- $ca := genSelfSignedCert $fqdn (list) (list $fqdn $name (printf "%s.%s" $name .Release.Namespace)) 365 }}
apiVersion: v1
kind: Secret
metadata:
  name: datafy-controller-webhook-tls
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "datafy-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
  {{- with .Values.extraAnnotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ b64enc (trim $ca.Cert) }}
  tls.key: {{ b64enc (trim $ca.Key) }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: datafy-controller-webhook
  labels:
  {{- include "datafy-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
  {{- with .Values.extraAnnotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
webhooks:
  - name: pod-mutationg.datafy.io
    admissionReviewVersions: [ "v1" ]
    sideEffects: None
    reinvocationPolicy: IfNeeded
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE" ]
        resources: [ "pods" ]
        scope: "*"
    {{- $excluded := (((.Values.controller).webhook).excludedPods).labels | default dict }}
    {{- range $key, $values := $excluded }}
    {{- if and $values (not (kindIs "slice" $values)) }}
    {{- fail (printf "controller.webhook.excludedPods.labels.%s must be a list of label values (with --set, escape dots in the label key: labels.app\\.kubernetes\\.io/name={...})" $key) }}
    {{- end }}
    {{- end }}
    objectSelector:
      matchExpressions:
        - key: "app.kubernetes.io/name"
          operator: "NotIn"
          values:
            - datafy-controller
            - datafy-agent
            - aws-cluster-autoscaler
            - aws-node
            {{- range get $excluded "app.kubernetes.io/name" | default list | compact }}
            - {{ . | quote }}
            {{- end }}
        - key: "k8s-app"
          operator: "NotIn"
          values:
            - kube-dns
            - kube-proxy
            - coredns
            - aws-node
            - istio-cni-node
            {{- range get $excluded "k8s-app" | default list | compact }}
            - {{ . | quote }}
            {{- end }}
        - key: "app"
          operator: "NotIn"
          values:
            - ztunnel
        {{- range $key := keys $excluded | sortAlpha }}
        {{- if not (has $key (list "app.kubernetes.io/name" "k8s-app")) }}
        {{- with get $excluded $key | default list | compact }}
        - key: {{ $key | quote }}
          operator: "NotIn"
          values:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: datafy-controller-webhook
        path: /mutate-v1-pods
        port: 443
      caBundle: {{ b64enc (trim $ca.Cert) }}
  - name: datafy-controller-agent-delete.datafy.io
    admissionReviewVersions: [ "v1" ]
    sideEffects: NoneOnDryRun
    failurePolicy: Ignore
    timeoutSeconds: 30
    matchPolicy: Equivalent
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "DELETE" ]
        resources: [ "pods" ]
        scope: "*"
    objectSelector:
      matchExpressions:
        - key: "app"
          operator: "In"
          values:
            - datafy-agent
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: datafy-controller-webhook
        path: /taint-agent-node
        port: 443
      caBundle: {{ b64enc (trim $ca.Cert) }}
{{- end }}
