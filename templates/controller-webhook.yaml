{{- if eq (include "datafy-agent.extendedInstallEnabled" .) "true" }}
{{- $name := "datafy-controller-webhook" }}
{{- $fqdn := printf "%s.%s.svc" $name .Release.Namespace }}
{{- $ca := genSelfSignedCert $fqdn (list) (list $fqdn $name (printf "%s.%s" $name .Release.Namespace)) 365 }}
apiVersion: v1
kind: Secret
metadata:
  name: datafy-controller-webhook-tls
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "datafy-agent.common.labels.withInstallationId" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
  {{- with .Values.extraAnnotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ b64enc (trim $ca.Cert) }}
  tls.key: {{ b64enc (trim $ca.Key) }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: datafy-controller-webhook
  labels:
  {{- include "datafy-agent.common.labels.withInstallationId" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
  {{- with .Values.extraAnnotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
webhooks:
  - name: pod-mutationg.datafy.io
    admissionReviewVersions: [ "v1" ]
    sideEffects: None
    reinvocationPolicy: IfNeeded
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE" ]
        resources: [ "pods" ]
        scope: "*"
    {{- $excludedNamespaces := (((.Values.controller).webhook).excluded).namespaces | default list }}
    {{- if not (kindIs "slice" $excludedNamespaces) }}
    {{- fail "controller.webhook.excluded.namespaces must be a list of namespace names (with --set: excluded.namespaces={my-ns,other-ns})" }}
    {{- end }}
    {{- with $excludedNamespaces | compact | uniq }}
    namespaceSelector:
      matchExpressions:
        - key: "kubernetes.io/metadata.name"
          operator: "NotIn"
          values:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
    {{- end }}
    {{- $podLabels := (((.Values.controller).webhook).excluded).podLabels | default dict }}
    {{- range $key, $values := $podLabels }}
    {{- if and $values (not (kindIs "slice" $values)) }}
    {{- fail (printf "controller.webhook.excluded.podLabels.%s must be a list of label values (with --set, escape dots in the label key: podLabels.app\\.kubernetes\\.io/name={...})" $key) }}
    {{- end }}
    {{- end }}
    {{- $builtin := dict
        "app.kubernetes.io/name" (list "datafy-controller" "datafy-agent" "aws-cluster-autoscaler" "aws-node")
        "k8s-app" (list "kube-dns" "kube-proxy" "coredns" "aws-node" "istio-cni-node")
        "app" (list "ztunnel") }}
    objectSelector:
      matchExpressions:
        {{- range $key := list "app.kubernetes.io/name" "k8s-app" "app" }}
        {{- $values := get $builtin $key }}
        {{- range get $podLabels $key | default list | compact }}
        {{- if not (has . $values) }}
        {{- $values = append $values . }}
        {{- end }}
        {{- end }}
        - key: {{ $key | quote }}
          operator: "NotIn"
          values:
            {{- range $values }}
            - {{ . | quote }}
            {{- end }}
        {{- end }}
        {{- range $key := keys $podLabels | sortAlpha }}
        {{- if not (hasKey $builtin $key) }}
        {{- with get $podLabels $key | default list | compact | uniq }}
        - key: {{ $key | quote }}
          operator: "NotIn"
          values:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: datafy-controller-webhook
        path: /mutate-v1-pods
        port: 443
      caBundle: {{ b64enc (trim $ca.Cert) }}
  - name: datafy-controller-agent-delete.datafy.io
    admissionReviewVersions: [ "v1" ]
    sideEffects: NoneOnDryRun
    failurePolicy: Ignore
    timeoutSeconds: 30
    matchPolicy: Equivalent
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "DELETE" ]
        resources: [ "pods" ]
        scope: "*"
    objectSelector:
      matchExpressions:
        - key: "app"
          operator: "In"
          values:
            - datafy-agent
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: datafy-controller-webhook
        path: /taint-agent-node
        port: 443
      caBundle: {{ b64enc (trim $ca.Cert) }}
{{- end }}
