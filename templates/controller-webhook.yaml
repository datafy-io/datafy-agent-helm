{{- if eq (include "datafy-agent.extendedInstallEnabled" .) "true" }}
# Empty secret the controller populates itself. We intentionally omit `data` so
# helm upgrades do not wipe the CA + serving cert the datafy-controller writes and rotates.
apiVersion: v1
kind: Secret
metadata:
  name: datafy-controller-webhook-certificate
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "datafy-agent.controllerLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
  {{- with .Values.extraAnnotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: datafy-controller-mutating-webhook
  labels:
  {{- include "datafy-agent.controllerLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
  {{- with .Values.extraAnnotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
webhooks:
  - name: pod-mutationg.datafy.io
    admissionReviewVersions: [ "v1" ]
    sideEffects: None
    reinvocationPolicy: IfNeeded
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE" ]
        resources: [ "pods" ]
        scope: "*"
    objectSelector:
      matchExpressions:
        - key: "app.kubernetes.io/name"
          operator: "NotIn"
          values:
            - datafy-controller
            - datafy-agent
            - aws-cluster-autoscaler
            - aws-node
        - key: "k8s-app"
          operator: "NotIn"
          values:
            - kube-dns
            - kube-proxy
            - coredns
            - aws-node
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: datafy-controller-webhook
        path: /mutate-v1-pods
        port: 443
      # caBundle is generated, injected and rotated by the datafy-controller (cert-controller rotator).
  - name: datafy-controller-agent-delete.datafy.io
    admissionReviewVersions: [ "v1" ]
    sideEffects: NoneOnDryRun
    failurePolicy: Ignore
    timeoutSeconds: 30
    matchPolicy: Equivalent
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "DELETE" ]
        resources: [ "pods" ]
        scope: "*"
    objectSelector:
      matchExpressions:
        - key: "app"
          operator: "In"
          values:
            - datafy-agent
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: datafy-controller-webhook
        path: /taint-agent-node
        port: 443
      # caBundle (see above)
{{- end }}
