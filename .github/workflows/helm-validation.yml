name: Test Chart

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  id-token: write
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [Sensor, AutoScaler]

    name: Test_${{ matrix.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        run: ct lint --charts . --config .ct.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ secrets.MANAGEMENT_AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ECR pull secret for the controller image
        run: bash scripts/helm-validation/ecr-pull-secret.sh "${{ steps.ecr.outputs.registry }}" test

      - name: Apply fake EBS CSI resources
        run: kubectl apply -f scripts/helm-validation/fake-ebs-csi.yaml

      # Agent detects AWS via IMDS (169.254.169.254). Kind has none — run AWS EC2 Metadata Mock on each node + DNAT.
      - name: Fake EC2 IMDS on Kind nodes
        run: bash scripts/helm-validation/setup-kind-fake-ec2-imds.sh

      - name: Run chart-testing (install)
        id: ct_install
        run: |
          set -euo pipefail
          NS=test
          # Live snapshots every 30s while Helm waits (otherwise the log looks "stuck")
          (
            while true; do
              sleep 30
              echo "::group::Cluster snapshot (namespace $NS)"
              date -u "+%Y-%m-%dT%H:%M:%SZ"
              kubectl get pods -n "$NS" -o wide 2>/dev/null || echo "(namespace not created yet)"
              echo "--- recent events ---"
              kubectl get events -n "$NS" --sort-by=.lastTimestamp 2>/dev/null | tail -30 || true
              echo "--- agent logs (PREVIOUS = last crash → BackOff reason) ---"
              AG_PODS=$(kubectl get pods -n "$NS" -l app=datafy-agent -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
              if [ -z "${AG_PODS// }" ]; then
                echo "(no pods with label app=datafy-agent yet)"
              fi
              for p in $AG_PODS; do
                for c in $(kubectl get pod -n "$NS" "$p" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
                  echo ">>> $p / $c --previous"
                  if ! kubectl logs -n "$NS" "$p" -c "$c" --previous --tail=150 2>&1; then
                    echo ">>> $p / $c --current (no/failed --previous yet)"
                    kubectl logs -n "$NS" "$p" -c "$c" --tail=80 2>&1 || true
                  fi
                  echo ""
                done
              done
              echo "::endgroup::"
            done
          ) &
          WATCH_PID=$!
          cleanup() { kill "$WATCH_PID" 2>/dev/null || true; wait "$WATCH_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          ct install \
            --charts . \
            --target-branch ${{ github.event.repository.default_branch }} \
            --config .ct.yaml \
            --namespace "$NS" \
            --skip-clean-up \
            --helm-extra-set-args "--debug --create-namespace --timeout 5m --set agent.dsoUrl='wss://dso-stg.datafy.io' --set agent.token=${{ secrets.STGN_SECRET }} --set agent.mode=${{ matrix.mode }} --set agent.coreMockEnabled=true --set agent.hqMockEnabled=true --set controller.image.repository=${{ steps.ecr.outputs.registry }}/datafy-io/datafy-controller --set imagePullSecrets[0]=ecr-pull"

      - name: Debug chart install failure
        if: failure() && steps.ct_install.outcome == 'failure'
        run: |
          set -x
          NS=test
          echo "=== helm releases in $NS ==="
          helm list -n "$NS" -a || true
          echo "=== pods ==="
          kubectl get pods -n "$NS" -o wide || true
          echo "=== events ==="
          kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -80 || true
          echo "=== pod descriptions ==="
          for p in $(kubectl get pods -n "$NS" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            echo "----- describe pod/$p -----"
            kubectl describe pod -n "$NS" "$p" || true
          done
          echo "::group::Logs — init containers"
          for p in $(kubectl get pods -n "$NS" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            for c in $(kubectl get pod -n "$NS" "$p" -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null); do
              echo "========== $p init/$c (current) =========="
              kubectl logs -n "$NS" "$p" -c "$c" --tail=200 2>&1 || true
              echo "========== $p init/$c (--previous) =========="
              kubectl logs -n "$NS" "$p" -c "$c" --previous --tail=200 2>&1 || true
            done
          done
          echo "::endgroup::"
          echo "::group::Logs — app containers (use --previous for BackOff / crash reason)"
          for p in $(kubectl get pods -n "$NS" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            for c in $(kubectl get pod -n "$NS" "$p" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
              echo "========== $p / $c — CURRENT (may be empty if restarting) =========="
              kubectl logs -n "$NS" "$p" -c "$c" --tail=200 2>&1 || true
              echo "========== $p / $c — PREVIOUS (last exit; this explains BackOff) =========="
              kubectl logs -n "$NS" "$p" -c "$c" --previous --tail=200 2>&1 || true
            done
          done
          echo "::endgroup::"

      - name: Capture ct release name
        id: capture_release
        run: |
          command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)
          rel=$(helm list -n test -o json | jq -r '.[] | select(.chart | test("^datafy-agent-")) | .name' | head -n1)
          if [ -z "$rel" ]; then
            echo "No ct-installed release found in namespace test" >&2
            helm list -n test
            exit 1
          fi
          echo "Found release: $rel"
          echo "release_name=$rel" >> "$GITHUB_OUTPUT"

  # Install latest from helm.datafy.io → upgrade to PR chart → uninstall.
  testupgrade-uninstall:
    runs-on: ubuntu-latest
    name: test_upgrade_&_uninstall
    steps:
      - name: Checkout repository (PR branch chart)
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0

      - name: Add Helm repos
        run: |
          helm repo add datafyio https://helm.datafy.io/datafy-agent
          helm repo update

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ secrets.MANAGEMENT_AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ECR pull secret for the controller image
        run: bash scripts/helm-validation/ecr-pull-secret.sh "${{ steps.ecr.outputs.registry }}" datafy-agent

      - name: Apply fake EBS CSI resources
        run: kubectl apply -f scripts/helm-validation/fake-ebs-csi.yaml

      - name: Fake EC2 IMDS on Kind nodes
        run: bash scripts/helm-validation/setup-kind-fake-ec2-imds.sh

      - name: Helm install (published chart)
        run: |
          set -euo pipefail
          NS=datafy-agent
          ( while true; do sleep 30; bash scripts/helm-validation/snapshot.sh "$NS"; done ) &
          trap 'kill $! 2>/dev/null || true' EXIT
          helm install datafy-agent datafyio/datafy-agent \
            --namespace "$NS" \
            --create-namespace \
            --timeout 5m \
            --wait \
            --debug \
            --set agent.dsoUrl='wss://dso-stg.datafy.io' \
            --set agent.token=${{ secrets.STGN_SECRET }} \
            --set agent.mode=AutoScaler \
            --set agent.coreMockEnabled=true \
            --set agent.hqMockEnabled=true

      - name: Helm upgrade (PR branch chart)
        run: |
          set -euo pipefail
          NS=datafy-agent
          ( while true; do sleep 30; bash scripts/helm-validation/snapshot.sh "$NS"; done ) &
          trap 'kill $! 2>/dev/null || true' EXIT
          helm upgrade datafy-agent . \
            --namespace "$NS" \
            --timeout 5m \
            --wait \
            --debug \
            --set agent.dsoUrl='wss://dso-stg.datafy.io' \
            --set agent.token=${{ secrets.STGN_SECRET }} \
            --set agent.mode=AutoScaler \
            --set agent.coreMockEnabled=true \
            --set agent.hqMockEnabled=true \
            --set controller.image.repository=${{ steps.ecr.outputs.registry }}/datafy-io/datafy-controller \
            --set imagePullSecrets[0]=ecr-pull

      - name: Verify installation-id after upgrade
        run: |
          set -euo pipefail
          bash scripts/helm-validation/check-cluster-installation-id.sh datafy-agent > /tmp/upgrade-id

      # Upgrading again renders a new installation-id; every resource and the
      # controller must move to it together.
      - name: Helm upgrade again (PR branch chart)
        run: |
          set -euo pipefail
          NS=datafy-agent
          ( while true; do sleep 30; bash scripts/helm-validation/snapshot.sh "$NS"; done ) &
          trap 'kill $! 2>/dev/null || true' EXIT
          helm upgrade datafy-agent . \
            --namespace "$NS" \
            --timeout 5m \
            --wait \
            --debug \
            --set agent.dsoUrl='wss://dso-stg.datafy.io' \
            --set agent.token=${{ secrets.STGN_SECRET }} \
            --set agent.mode=AutoScaler \
            --set agent.coreMockEnabled=true \
            --set agent.hqMockEnabled=true \
            --set controller.image.repository=${{ steps.ecr.outputs.registry }}/datafy-io/datafy-controller \
            --set imagePullSecrets[0]=ecr-pull

      - name: Verify installation-id changed after second upgrade
        run: |
          set -euo pipefail
          bash scripts/helm-validation/check-cluster-installation-id.sh datafy-agent "$(cat /tmp/upgrade-id)"

      - name: Helm uninstall
        run: |
          set -euo pipefail
          NS=datafy-agent
          helm uninstall datafy-agent --namespace "$NS" --wait --timeout 5m --debug

      - name: Verify uninstall
        run: |
          set -euo pipefail
          NS=datafy-agent
          if helm status datafy-agent -n "$NS" >/dev/null 2>&1; then
            echo "Release datafy-agent still exists after uninstall" >&2
            helm list -n "$NS"
            exit 1
          fi
          echo "Release datafy-agent removed (uninstall OK)"
          remaining=$(kubectl get pods -n "$NS" --no-headers 2>/dev/null | wc -l | tr -d ' ' || echo 0)
          if [[ "${remaining}" != "0" ]]; then
            echo "Note: $remaining pod(s) still in $NS (terminating or non-chart):" >&2
            kubectl get pods -n "$NS" -o wide >&2 || true
          fi

      - name: Debug upgrade / uninstall failure
        if: failure()
        run: |
          bash scripts/helm-validation/snapshot.sh datafy-agent || true
          helm list -n datafy-agent || true
          helm history datafy-agent -n datafy-agent 2>/dev/null || true

  # PR chart: install → uninstall → install → uninstall.
  # The second install lands on the controller resources the first one kept
  # (helm.sh/resource-policy: keep), so Helm 4 server-side apply must take them over
  # without conflicts, and the reinstall must get a new installation-id.
  testreinstall:
    runs-on: ubuntu-latest
    name: test_reinstall
    env:
      NS: datafy-agent
    steps:
      - name: Checkout repository (PR branch chart)
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ secrets.MANAGEMENT_AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ECR pull secret for the controller image
        run: bash scripts/helm-validation/ecr-pull-secret.sh "${{ steps.ecr.outputs.registry }}" datafy-agent

      - name: Apply fake EBS CSI resources
        run: kubectl apply -f scripts/helm-validation/fake-ebs-csi.yaml

      - name: Fake EC2 IMDS on Kind nodes
        run: bash scripts/helm-validation/setup-kind-fake-ec2-imds.sh

      - name: Helm install (PR branch chart)
        run: |
          set -euo pipefail
          ( while true; do sleep 30; bash scripts/helm-validation/snapshot.sh "$NS"; done ) &
          trap 'kill $! 2>/dev/null || true' EXIT
          helm install datafy-agent . \
            --namespace "$NS" \
            --create-namespace \
            --timeout 5m \
            --wait \
            --debug \
            --set agent.dsoUrl='wss://dso-stg.datafy.io' \
            --set agent.token=${{ secrets.STGN_SECRET }} \
            --set agent.mode=AutoScaler \
            --set agent.coreMockEnabled=true \
            --set agent.hqMockEnabled=true \
            --set controller.image.repository=${{ steps.ecr.outputs.registry }}/datafy-io/datafy-controller \
            --set imagePullSecrets[0]=ecr-pull

      - name: Verify installation-id after install
        run: |
          set -euo pipefail
          bash scripts/helm-validation/check-cluster-installation-id.sh "$NS" > /tmp/first-id

      - name: Helm uninstall
        run: |
          set -euo pipefail
          helm uninstall datafy-agent --namespace "$NS" --wait --timeout 5m --debug

      - name: Show leftovers before reinstall
        run: |
          kubectl get deploy,svc,sa,cm,secret -n "$NS" -L datafy.io/installation-id,datafy.io/install-id || true
          kubectl get deploy datafy-controller -n "$NS" -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}' || true

      - name: Helm reinstall (PR branch chart)
        run: |
          set -euo pipefail
          ( while true; do sleep 30; bash scripts/helm-validation/snapshot.sh "$NS"; done ) &
          trap 'kill $! 2>/dev/null || true' EXIT
          helm install datafy-agent . \
            --namespace "$NS" \
            --timeout 5m \
            --wait \
            --debug \
            --set agent.dsoUrl='wss://dso-stg.datafy.io' \
            --set agent.token=${{ secrets.STGN_SECRET }} \
            --set agent.mode=AutoScaler \
            --set agent.coreMockEnabled=true \
            --set agent.hqMockEnabled=true \
            --set controller.image.repository=${{ steps.ecr.outputs.registry }}/datafy-io/datafy-controller \
            --set imagePullSecrets[0]=ecr-pull

      - name: Verify reinstall
        run: |
          set -euo pipefail
          bash scripts/helm-validation/check-cluster-installation-id.sh "$NS" "$(cat /tmp/first-id)"
          kubectl get deploy,svc,sa,cm,secret -n "$NS" -L datafy.io/installation-id,datafy.io/install-id
          kubectl get deploy datafy-controller -n "$NS" -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}' | grep -E 'INSTALL|TRANSPARENT'
          kubectl rollout status deploy/datafy-controller -n "$NS" --timeout 3m

      - name: Helm uninstall (after reinstall)
        run: |
          set -euo pipefail
          helm uninstall datafy-agent --namespace "$NS" --wait --timeout 5m --debug

      - name: Debug reinstall failure
        if: failure()
        run: |
          bash scripts/helm-validation/snapshot.sh "$NS" || true
          helm list -n "$NS" || true
          helm history datafy-agent -n "$NS" 2>/dev/null || true

  # Every rendered resource must carry the datafy.io/installation-id label.
  testlabels:
    runs-on: ubuntu-latest
    name: test_installation_id_label
    steps:
      - name: Checkout repository (PR branch chart)
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0

      - name: Check installation-id label on all resources
        run: bash scripts/helm-validation/check-installation-id.sh .
