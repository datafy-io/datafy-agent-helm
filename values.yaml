## @param extraLabels Labels to add to all deployed objects
##
extraLabels: {}
## @param extraAnnotations Annotations to add to all deployed objects
##
extraAnnotations: {}

## Optionally specify an array of imagePullSecrets used by all pods in this chart.
## Secrets must be manually created in the namespace.
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
## e.g:
## imagePullSecrets:
##   - myRegistryKeySecretName
##
imagePullSecrets: []

## @param extendedInstallOnSensor Enable controller/webhook-related resources
## If false, chart skips controller config, RBAC, webhook secret/config, and controller deployment/service.
##
extendedInstallOnSensor: false

## @param proxy.httpsProxy HTTPS proxy URL
## @param proxy.noProxy Comma-separated host/IP/CIDR/DNS-suffix list to bypass the proxy
##
proxy:
  httpsProxy: ""
  noProxy: ""

## @param agent.token Datafy agent token
## @param agent.mode The mode of agent to install. Valid values: "Sensor", "AutoScaler"
## @param agent.env Environment variables to add to datafy-agent daemon set
##
agent:
  token:
  mode: AutoScaler
  dsoUrl: wss://dso.datafy.io

  ## @param agent.converterVersion (default: "latest")
  converterVersion:

  ## @param agent.updateStrategy Update strategy for the agent DaemonSet
  ## Ref: https://kubernetes.io/docs/tasks/manage-daemon/update-daemon-set/
  ##
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  ## @param agent.externalTokenSecret.name The name of an existing secret that contains the token
  ## @param agent.externalTokenSecret.key The key in the secret that contains the token
  externalTokenSecret:
    name:
    key:

  ## @param agent.skipUpgradeMatrixCheck Skip the pre-upgrade version compatibility check.
  ##
  skipUpgradeMatrixCheck: false

  # @ignored
  coreMockEnabled: false
  # @ignored
  hqMockEnabled: false

  ## @param agent.notifications.defer_until_csi_ack Wait for the CSI proxy to ack a notification before the agent considers it handled. Defaults to "true".
  ## @param agent.notifications.wait_for_ack_timeout How long the agent waits for the CSI proxy ack before giving up. Defaults to "5s".
  notifications:
    defer_until_csi_ack: true
    wait_for_ack_timeout: 5s

  ## @param agent.affinity Affinity for pod assignment
  ## @param agent.affinity Extra affinity for pod assignment, merged (ANDed) on top
  ## of the chart-enforced node affinity. Pod (anti-)affinity is preserved as-is;
  ## the enforced compute-type/instance-type rules cannot be relaxed, only further
  ## restricted.
  ## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  ##
  affinity: {}

  ## @param agent.nodeSelector Node labels for pod assignment
  ## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
  ##
  nodeSelector: {}
  ## @param agent.tolerations Tolerations for pod assignment
  ## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  ##
  tolerations:
    - operator: "Exists"

  securityContext:
    privileged: true
    runAsUser: 1000
    runAsGroup: 1000

  image:
    pullPolicy: Always
    repository: public.ecr.aws/datafy-io/datafy-agent
    tag:

  serviceAccount:
    create: true
    name: datafy-agent-sa

monitor:
  probe:
    interval: 5s
    timeout: 4s
    failureThreshold: 12
    successThreshold: 2

  image:
    pullPolicy: IfNotPresent
    repository: public.ecr.aws/datafy-io/datafy-monitor
    tag:

controller:
  replicas: 2

  serviceAccount:
    ## @param controller.serviceAccount.name Name of the controller ServiceAccount
    name: datafy-controller-sa
    ## @param controller.serviceAccount.roleArn IAM role ARN for tokenless (IRSA) mode.
    ## When set, the role is attached to the controller ServiceAccount via the
    ## eks.amazonaws.com/role-arn annotation.
    roleArn:
    ## @param controller.serviceAccount.tokenless When enabled, token validation is skipped to
    ## allow installation without a token. Works only on EKS clusters with IMDS hop limit greater than 1.
    tokenless: false

  image:
    pullPolicy: IfNotPresent
    repository: public.ecr.aws/datafy-io/datafy-controller
    tag:

  ## @param controller.readinessProbe
  ## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes
  ##
  health:
    enabled: true
    livenessProbe:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 5
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 2

  ## @param controller.affinity Affinity for pod assignment
  ## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  ##
  affinity:
  ## @param controller.nodeSelector Node labels for pod assignment
  ## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
  ##
  nodeSelector: {}
  ## @param controller.tolerations Extra tolerations, appended to the chart's built-in ones
  ## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  ##
  tolerations: []

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001

  webhook:
    ## Pods the pod mutation webhook must skip, on top of the built-in exclusions in
    ## templates/_webhook-excluded.tpl (CNI, mesh datapath, DNS, node credentials, etc...).
    ## Use it for node-level components that must start even when the webhook is unreachable.
    ## Without a chart change, label a pod (template) to skip it: `datafy.io/webhook=disabled`
    excluded:
      ## The default built-in exclusions (Datafy's own pods and AWS-native components: VPC CNI,
      ## kube-proxy, CoreDNS, EKS Pod Identity Agent, EFS/FSx/Mountpoint for S3/Secrets Store CSI node
      ## pods) always apply. Set to false to drop the extra built-in ones: non-AWS CNIs, service mesh
      ## (Istio, Linkerd, Kuma, Consul), NodeLocal DNSCache, the NVIDIA device plugin and Kyverno.
      ## @param controller.webhook.excluded.extraEnabled Also skip the extra built-in non-AWS node-level components
      extraEnabled: true
      ## Label selector requirements (as in a LabelSelector's matchExpressions) of pods to skip,
      ## rendered after the built-in ones, one expression per entry. operator is optional and
      ## defaults to NotIn; only NotIn (with values) and DoesNotExist (without values) are allowed.
      ## A later values file replaces the whole list; --set with an index edits that entry of it.
      ##   podMatchExpressions:
      ##     - key: k8s-app
      ##       values: [my-cni-agent]
      ##     - key: s3.csi.aws.com/mountpoint-version
      ##       operator: DoesNotExist
      ##   --set "controller.webhook.excluded.podMatchExpressions[0].key=k8s-app" \
      ##   --set "controller.webhook.excluded.podMatchExpressions[0].values={my-cni-agent}"
      ## @param controller.webhook.excluded.podMatchExpressions Label selector requirements of pods to exclude
      podMatchExpressions: []

ebsCsiProxy:
  image:
    pullPolicy: IfNotPresent
    repository: public.ecr.aws/datafy-io/ebs-csi-controller
    tag:

  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 40Mi

  ## @param ebsCsiProxy.volumeResolution.source Backend that drives CSI proxy volume resolution: "tags" or "saas". Empty uses the proxy default (tags).
  volumeResolution:
    source: tags

  ## @param ebsCsiProxy.notifications.wait_before_tag Testing-only: delay (e.g. "2s") the CSI proxy waits before sending the tag update when handling a notification. Empty disables the delay.
  ## @param ebsCsiProxy.notifications.wait_before_ack Testing-only: delay (e.g. "2s") the CSI proxy waits before acking a notification. Empty disables the delay.
  notifications:
    wait_before_tag:
    wait_before_ack:
